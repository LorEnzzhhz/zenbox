<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Zenbox" />
  <meta
    name="description"
    content="Zenbox — a minimal studio for chat, code, images, and writing, powered by 200+ free open models with a built-in sandbox. No credits. No limits."
  />
  <title>Zenbox — Free-model AI Studio</title>

  <style>
    /* Instant animated splash — plays before React mounts, then fades into
       the in-app BootScreen. Pure CSS, no network or JS required. */
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      pointer-events: none;
      animation: splash-out 0.5s ease 2.2s forwards;
    }
    @keyframes splash-out {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
    .splash-mark {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      overflow: hidden;
      background: #f5f5f5;
      border-radius: 14px;
      box-shadow: 0 18px 50px -18px rgba(0, 0, 0, 0.55);
      animation: mark-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes mark-in {
      from {
        transform: scale(0.82);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
    .splash-mark svg {
      width: 56px;
      height: 56px;
    }
    .splash-z {
      fill: none;
      stroke: #0a0a0a;
      stroke-width: 7;
      stroke-linecap: square;
      stroke-dasharray: 122;
      stroke-dashoffset: 122;
      animation: z-draw 0.45s ease 0.15s forwards;
    }
    .splash-frame {
      fill: none;
      stroke: rgba(10, 10, 10, 0.35);
      stroke-width: 1.5;
      stroke-dasharray: 360;
      stroke-dashoffset: 360;
      animation: z-draw 0.7s ease 0.5s forwards;
    }
    @keyframes z-draw {
      to {
        stroke-dashoffset: 0;
      }
    }
    .splash-sheen {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 34%;
      background: rgba(255, 255, 255, 0.28);
      filter: blur(3px);
      animation: sheen 1.5s ease-in-out 0.9s infinite;
    }
    @keyframes sheen {
      0% {
        transform: translateX(-180%);
      }
      60%,
      100% {
        transform: translateX(420%);
      }
    }
    .splash-word {
      display: flex;
      gap: 0.35em;
      margin-top: 26px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .splash-word span {
      display: inline-block;
      opacity: 0;
      transform: translateY(10px);
      filter: blur(4px);
      animation: word-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes word-in {
      to {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }
    .splash-bar {
      width: 176px;
      height: 1px;
      margin-top: 22px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 1px;
    }
    .splash-bar span {
      display: block;
      height: 100%;
      width: 50%;
      background: rgba(255, 255, 255, 0.75);
      animation: bar-run 1.1s ease-in-out infinite;
    }
    @keyframes bar-run {
      from {
        transform: translateX(-110%);
      }
      to {
        transform: translateX(320%);
      }
    }
  </style>
</head>

<body>
  <div id="boot-splash" aria-hidden="true">
    <div class="splash-mark">
      <svg viewBox="0 0 96 96">
        <path class="splash-z" d="M30 33 H66 L30 63 H66" />
        <rect class="splash-frame" x="3" y="3" width="90" height="90" rx="12" />
      </svg>
      <div class="splash-sheen"></div>
    </div>
    <div class="splash-word">
      <span style="animation-delay: 0.45s">Z</span>
      <span style="animation-delay: 0.5s">E</span>
      <span style="animation-delay: 0.55s">N</span>
      <span style="animation-delay: 0.6s">B</span>
      <span style="animation-delay: 0.65s">O</span>
      <span style="animation-delay: 0.7s">X</span>
    </div>
    <div class="splash-bar"><span></span></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
